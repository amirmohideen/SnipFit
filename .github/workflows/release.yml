# Signed release builds. Run manually (Actions → Release → Run workflow).
#
# Required repository secrets:
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#            (optional upload) PLAY_SERVICE_ACCOUNT_JSON
#   iOS:     IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
#            IOS_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID,
#            (optional upload) ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
# Firebase: commit lib/firebase/firebase_options_<flavor>.dart (public
# config) and add google-services.json / GoogleService-Info.plist as
# FIREBASE_ANDROID_JSON_<FLAVOR> / FIREBASE_IOS_PLIST_<FLAVOR> (base64).
name: Release

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: dev or prod
        required: true
        default: prod
        type: choice
        options: [dev, prod]
      upload:
        description: Upload to Play internal testing / TestFlight
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing and Firebase config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_JSON: ${{ inputs.flavor == 'prod' && secrets.FIREBASE_ANDROID_JSON_PROD || secrets.FIREBASE_ANDROID_JSON_DEV }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          if [ -n "$FIREBASE_JSON" ]; then mkdir -p android/app/src/${{ inputs.flavor }} && echo "$FIREBASE_JSON" | base64 -d > android/app/src/${{ inputs.flavor }}/google-services.json; fi
      - run: |
          flutter build appbundle --flavor ${{ inputs.flavor }} -t lib/main_${{ inputs.flavor }}.dart \
            --dart-define-from-file=config/${{ inputs.flavor }}.json \
            --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.flavor }}
          path: |
            build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
            build/symbols
      - if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.flavor == 'prod' && 'com.snipfit.app' || 'com.snipfit.app.dev' }}
          releaseFiles: build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
          track: internal

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/snipfit.mobileprovision
          sed -i '' "s/REPLACE_TEAM_ID/${{ secrets.APPLE_TEAM_ID }}/" ios/ExportOptions.plist
      - run: |
          flutter build ipa --flavor ${{ inputs.flavor }} -t lib/main_${{ inputs.flavor }}.dart \
            --dart-define-from-file=config/${{ inputs.flavor }}.json \
            --export-options-plist=ios/ExportOptions.plist \
            --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.flavor }}
          path: |
            build/ios/ipa/*.ipa
            build/symbols
      - if: ${{ inputs.upload }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 -d > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
